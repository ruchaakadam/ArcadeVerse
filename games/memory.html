<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game | ArcadeVerse</title>
    <link rel="stylesheet" href="../css/memory.css">
</head>
<body>

<nav class="navbar">
    <h2>🎮 ArcadeVerse</h2>
    <div class="nav-actions">
        <a href="../index.html#games" class="back-btn">🎮 Games</a>
        <a href="../index.html" class="back-btn">← Home</a>
    </div>
</nav>

<main class="memory-container">
    <h1>🧠 Memory Game</h1>
    <p class="subtitle">Match all the pairs as quickly as you can!</p>

    <div class="scoreboard">
        <div class="score-card">
            <h3>Moves</h3>
            <p id="moves">0</p>
        </div>
        <div class="score-card">
            <h3>Pairs</h3>
            <p id="pairs">0 / 4</p>
        </div>
    </div>

    <div id="memoryBoard" class="memory-board"></div>

    <div class="buttons">
        <button id="restartBtn">🔄 Restart Game</button>
    </div>
</main>

<div id="memoryPopup" class="popup">
    <div class="popup-box">
        <h2>🏆 You Won!</h2>
        <p id="finalMessage">Great memory!</p>
        <div class="popup-buttons">
            <button id="playAgainBtn">Play Again</button>
            <button onclick="window.location='../index.html'">Home</button>
        </div>
    </div>
</div>

<script src="../js/memory.js"></script>
</body>
</html>
