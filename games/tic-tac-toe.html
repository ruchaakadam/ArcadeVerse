<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe | ArcadeVerse</title>

    <link rel="stylesheet" href="../css/tic-tac-toe.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <h2>🎮 ArcadeVerse</h2>

        <a href="../index.html" class="back-btn">
            ← Home
        </a>

    </nav>

    <!-- ================= GAME ================= -->

    <div class="game-container">

        <h1>Tic Tac Toe</h1>

        <!-- Scoreboard -->

        <div class="scoreboard">

            <div class="score-card">
                <h3>X Wins</h3>
                <p id="xScore">0</p>
            </div>

            <div class="score-card">
                <h3>O Wins</h3>
                <p id="oScore">0</p>
            </div>

            <div class="score-card">
                <h3>Draws</h3>
                <p id="drawScore">0</p>
            </div>

        </div>

        <!-- Turn -->

        <div class="turn">
            Player X's Turn
        </div>

        <!-- Board -->

        <div class="board">

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

        </div>

        <!-- Restart -->

        <button class="restart-btn">
            🔄 Restart Game
        </button>

    </div>

    <!-- ================= POPUP ================= -->

    <div id="popup" class="popup">

        <div class="popup-box">

            <div id="popupText"></div>

            <button id="closePopup">
                Play Again
            </button>

        </div>

    </div>

    <script src="../js/tic-tac-toe.js"></script>

</body>
</html>
